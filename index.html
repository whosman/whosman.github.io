<body>
  <div id="root"></div>
  <div id="toast" class="copied-toast">Link copied!</div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // URL encoding utilities
    const encode = (obj) => btoa(encodeURIComponent(JSON.stringify(obj)));
    const decode = (str) => {
      try {
        return JSON.parse(decodeURIComponent(atob(str)));
      } catch {
        return null;
      }
    };

    const showToast = () => {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    };

    const copyToClipboard = (text) => {
      navigator.clipboard.writeText(text);
      showToast();
    };

    // Similarity calculation
    const calculateSimilarity = (rank1, rank2) => {
      if (!rank1 || !rank2 || rank1.length !== rank2.length) return null;
      const n = rank1.length;
      let sumDiffSq = 0;
      rank1.forEach((item, i) => {
        const j = rank2.indexOf(item);
        if (j !== -1) sumDiffSq += Math.pow(i - j, 2);
      });
      const maxDiff = (n * (n * n - 1)) / 3;
      return Math.round((1 - sumDiffSq / maxDiff) * 100);
    };

    const estimateComparisons = (n) => {
      let total = 0;
      for (let i = 1; i < n; i++) {
        total += Math.ceil(Math.log2(i + 1));
      }
      return total;
    };

    const Header = ({ showNew }) => {
      const goHome = () => {
        window.location.hash = '';
        window.location.reload();
      };

      return (
        <header className="header">
          <a href="#" className="header-logo" onClick={(e) => { e.preventDefault(); goHome(); }}>
            RankList
          </a>
          {showNew && (
            <a href="#" className="header-new" onClick={(e) => { e.preventDefault(); goHome(); }}>
              + New List
            </a>
          )}
        </header>
      );
    };

    // Views
    const CreateTemplate = ({ onComplete }) => {
      const [title, setTitle] = useState('');
      const [items, setItems] = useState(['', '', '', '', '']);

      const addItem = () => setItems([...items, '']);
      const removeItem = (i) => items.length > 3 && setItems(items.filter((_, idx) => idx !== i));
      const updateItem = (i, val) => {
        const newItems = [...items];
        newItems[i] = val;
        setItems(newItems);
      };

      const create = () => {
        const validItems = items.filter(i => i.trim());
        if (validItems.length >= 3 && title.trim()) {
          onComplete({ title: title.trim(), items: validItems });
        }
      };

      const isValid = title.trim() && items.filter(i => i.trim()).length >= 3;

      return (
        <div className="view-container">
          <h1 className="main-title">Create a Ranking</h1>
          <p className="subtitle">Build a template others can rank and compare</p>
          
          <div className="form-section">
            <label className="label">Title</label>
            <input
              type="text"
              className="input-field"
              placeholder="Best 90s Movies, Top Pizza Toppings..."
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              maxLength={60}
            />
          </div>

          <div className="form-section">
            <label className="label">Items to Rank</label>
            <p className="hint">Minimum 3 items. Add items in any order.</p>
            
            <div className="items-list">
              {items.map((item, i) => (
                <div key={i} className="item-row">
                  <input
                    type="text"
                    className="input-field item-input"
                    placeholder={`Item ${i + 1}`}
                    value={item}
                    onChange={(e) => updateItem(i, e.target.value)}
                    maxLength={50}
                  />
                  {items.length > 3 && (
                    <button className="btn-remove" onClick={() => removeItem(i)}>×</button>
                  )}
                </div>
              ))}
            </div>
            
            <button className="btn-secondary" onClick={addItem}>+ Add Item</button>
          </div>

          <button 
            className={`btn-primary ${!isValid ? 'disabled' : ''}`} 
            onClick={create}
            disabled={!isValid}
          >
            Create Template
          </button>
        </div>
      );
    };

    const RankItems = ({ template, onComplete }) => {
      const [phase, setPhase] = useState('name');
      const [name, setName] = useState('');
      const [ranked, setRanked] = useState([]);
      const [toInsert, setToInsert] = useState([]);
      const [currentItem, setCurrentItem] = useState(null);
      const [searchState, setSearchState] = useState({ low: 0, high: 0 });
      const [comparisons, setComparisons] = useState(0);

      const startComparing = () => {
        if (!name.trim()) return;
        
        const shuffled = [...template.items].sort(() => Math.random() - 0.5);
        setRanked([shuffled[0]]);
        setToInsert(shuffled.slice(1));
        setCurrentItem(shuffled[1]);
        setSearchState({ low: 0, high: 1 });
        setPhase('compare');
      };

      const handleChoice = (preferCurrent) => {
        const { low, high } = searchState;
        const mid = Math.floor((low + high) / 2);
        
        let newLow = low;
        let newHigh = high;
        
        if (preferCurrent) {
          newHigh = mid;
        } else {
          newLow = mid + 1;
        }
        
        setComparisons(c => c + 1);
        
        if (newLow >= newHigh) {
          const newRanked = [...ranked];
          newRanked.splice(newLow, 0, currentItem);
          setRanked(newRanked);
          
          const remaining = toInsert.slice(1);
          if (remaining.length === 0) {
            setPhase('done');
            onComplete({ name: name.trim(), ranking: newRanked });
          } else {
            setToInsert(remaining);
            setCurrentItem(remaining[0]);
            setSearchState({ low: 0, high: newRanked.length });
          }
        } else {
          setSearchState({ low: newLow, high: newHigh });
        }
      };

      const getMidItem = () => {
        const mid = Math.floor((searchState.low + searchState.high) / 2);
        return ranked[mid];
      };

      const progress = template.items.length > 1 
        ? ((template.items.length - toInsert.length - 1) / (template.items.length - 1)) * 100
        : 100;

      if (phase === 'name') {
        return (
          <div className="view-container">
            <h1 className="main-title">{template.title}</h1>
            <p className="subtitle">~{estimateComparisons(template.items.length)} quick "which do you prefer?" questions</p>

            <div className="form-section">
              <label className="label">Your Name</label>
              <input
                type="text"
                className="input-field"
                placeholder="Enter your name"
                value={name}
                onChange={(e) => setName(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && startComparing()}
                maxLength={30}
                autoFocus
              />
            </div>

            <button 
              className={`btn-primary ${!name.trim() ? 'disabled' : ''}`}
              onClick={startComparing}
              disabled={!name.trim()}
            >
              Start Ranking
            </button>
          </div>
        );
      }

      if (phase === 'compare') {
        const midItem = getMidItem();
        
        return (
          <div className="view-container">
            <div className="compare-header-bar">
              <span className="compare-progress-text">{template.title}</span>
              <span className="compare-count">{comparisons} answered</span>
            </div>
            
            <div className="progress-bar">
              <div className="progress-fill" style={{ width: `${progress}%` }} />
            </div>

            <p className="compare-question">Which do you prefer?</p>

            <div className="choice-container">
              <button className="choice-btn" onClick={() => handleChoice(true)}>
                {currentItem}
              </button>
              
              <span className="choice-vs">or</span>
              
              <button className="choice-btn" onClick={() => handleChoice(false)}>
                {midItem}
              </button>
            </div>

            <p className="compare-hint">Ranking {ranked.length + 1} of {template.items.length} items</p>
          </div>
        );
      }

      return null;
    };

    const ViewResult = ({ template, result, onRankSame }) => {
      const resultUrl = `${window.location.origin}${window.location.pathname}#r/${encode({ t: template, r: result })}`;

      return (
        <div className="view-container">
          <h1 className="main-title">{template.title}</h1>
          <p className="subtitle">{result.name}'s ranking</p>

          <div className="result-list">
            {result.ranking.map((item, i) => (
              <div key={item} className="result-item">
                <span className="result-number">{i + 1}</span>
                <span className="result-text">{item}</span>
              </div>
            ))}
          </div>

          <div className="action-group">
            <button className="btn-primary" onClick={onRankSame}>
              Rank This List
            </button>
            <button className="btn-secondary" onClick={() => copyToClipboard(resultUrl)}>
              Copy Link
            </button>
          </div>
        </div>
      );
    };

    const CompareResults = ({ template, result1, result2, onRankSame }) => {
      const similarity = calculateSimilarity(result1.ranking, result2.ranking);
      const compareUrl = `${window.location.origin}${window.location.pathname}#c/${encode({ t: template, r1: result1, r2: result2 })}`;

      const getPositionDiff = (item) => {
        const pos1 = result1.ranking.indexOf(item);
        const pos2 = result2.ranking.indexOf(item);
        return Math.abs(pos1 - pos2);
      };

      return (
        <div className="view-container wide">
          <h1 className="main-title">{template.title}</h1>
          <div className="compare-header">
            <span className="compare-names">{result1.name} vs {result2.name}</span>
            <span className="similarity-badge">{similarity}% similar</span>
          </div>

          <div className="compare-grid">
            <div className="compare-column">
              <h3 className="compare-column-title">{result1.name}</h3>
              {result1.ranking.map((item, i) => {
                const diff = getPositionDiff(item);
                const isExtreme = i < 3 || i >= result1.ranking.length - 3;
                return (
                  <div 
                    key={item} 
                    className={`compare-item ${diff >= 5 ? 'divergent' : ''} ${isExtreme && diff >= 3 ? 'extreme-diff' : ''}`}
                  >
                    <span className="compare-number">{i + 1}</span>
                    <span className="compare-text">{item}</span>
                    {diff >= 3 && <span className="diff-badge">±{diff}</span>}
                  </div>
                );
              })}
            </div>

            <div className="compare-column">
              <h3 className="compare-column-title">{result2.name}</h3>
              {result2.ranking.map((item, i) => {
                const diff = getPositionDiff(item);
                const isExtreme = i < 3 || i >= result2.ranking.length - 3;
                return (
                  <div 
                    key={item} 
                    className={`compare-item ${diff >= 5 ? 'divergent' : ''} ${isExtreme && diff >= 3 ? 'extreme-diff' : ''}`}
                  >
                    <span className="compare-number">{i + 1}</span>
                    <span className="compare-text">{item}</span>
                    {diff >= 3 && <span className="diff-badge">±{diff}</span>}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="action-group">
            <button className="btn-primary" onClick={onRankSame}>
              Rank This List
            </button>
            <button className="btn-secondary" onClick={() => copyToClipboard(compareUrl)}>
              Copy Comparison Link
            </button>
          </div>
        </div>
      );
    };

    const TemplateCreated = ({ template, onShare }) => {
      const templateUrl = `${window.location.origin}${window.location.pathname}#t/${encode(template)}`;

      return (
        <div className="view-container">
          <div className="success-icon">✓</div>
          <h1 className="main-title">Template Created</h1>
          <p className="subtitle">{template.title}</p>
          
          <div className="url-display">
            <code>{templateUrl.length > 50 ? templateUrl.slice(0, 50) + '...' : templateUrl}</code>
          </div>

          <div className="action-group">
            <button className="btn-primary" onClick={() => onShare('rank')}>
              Rank It Yourself
            </button>
            <button className="btn-secondary" onClick={() => copyToClipboard(templateUrl)}>
              Copy Template Link
            </button>
          </div>
        </div>
      );
    };

    const ResultSubmitted = ({ template, result, compareWith, onAction }) => {
      const similarity = compareWith ? calculateSimilarity(result.ranking, compareWith.ranking) : null;
      const resultUrl = `${window.location.origin}${window.location.pathname}#r/${encode({ t: template, r: result })}`;

      return (
        <div className="view-container">
          <div className="success-icon">✓</div>
          <h1 className="main-title">Ranking Submitted</h1>
          <p className="subtitle">{result.name}'s ranking for {template.title}</p>

          {compareWith && (
            <div className="auto-compare-prompt">
              <p className="compare-tease">
                You and <strong>{compareWith.name}</strong> are <strong>{similarity}% similar</strong>
              </p>
              <button className="btn-primary" onClick={() => onAction('compare')}>
                See Full Comparison
              </button>
            </div>
          )}

          {!compareWith && (
            <div className="action-group">
              <button className="btn-primary" onClick={() => onAction('viewResult')}>
                View Your Ranking
              </button>
            </div>
          )}

          <button className="btn-secondary" onClick={() => copyToClipboard(resultUrl)}>
            Copy Link to Share
          </button>
        </div>
      );
    };

    // Main App
    function App() {
      const [view, setView] = useState('create');
      const [template, setTemplate] = useState(null);
      const [result, setResult] = useState(null);
      const [compareResult, setCompareResult] = useState(null);
      const [originResult, setOriginResult] = useState(null);

      useEffect(() => {
        const hash = window.location.hash.slice(1);
        if (!hash) return;

        const [type, data] = hash.split('/');
        const decoded = decode(data);
        if (!decoded) return;

        if (type === 't') {
          setTemplate(decoded);
          setView('rank');
        } else if (type === 'r') {
          setTemplate(decoded.t);
          setResult(decoded.r);
          setOriginResult(decoded.r);
          setView('viewResult');
        } else if (type === 'c') {
          setTemplate(decoded.t);
          setResult(decoded.r1);
          setCompareResult(decoded.r2);
          setView('compare');
        }
      }, []);

      const handleTemplateCreated = (t) => {
        setTemplate(t);
        setView('templateCreated');
        window.location.hash = `t/${encode(t)}`;
      };

      const handleRankComplete = (r) => {
        setResult(r);
        setView('resultSubmitted');
      };

      const handleResultAction = (action) => {
        if (action === 'compare') {
          setCompareResult(originResult);
          setView('compare');
          window.location.hash = `c/${encode({ t: template, r1: result, r2: originResult })}`;
        } else if (action === 'viewResult') {
          setView('viewResult');
          window.location.hash = `r/${encode({ t: template, r: result })}`;
        }
      };

      const handleRankSame = () => {
        setOriginResult(result || originResult);
        setResult(null);
        setCompareResult(null);
        setView('rank');
        window.location.hash = `t/${encode(template)}`;
      };

      const handleShare = (type) => {
        if (type === 'rank') {
          setView('rank');
        }
      };

      const showNewButton = view !== 'create';

      return (
        <div className="app">
          <Header showNew={showNewButton} />
          {view === 'create' && <CreateTemplate onComplete={handleTemplateCreated} />}
          {view === 'templateCreated' && <TemplateCreated template={template} onShare={handleShare} />}
          {view === 'rank' && <RankItems template={template} onComplete={handleRankComplete} />}
          {view === 'resultSubmitted' && <ResultSubmitted template={template} result={result} compareWith={originResult} onAction={handleResultAction} />}
          {view === 'viewResult' && <ViewResult template={template} result={result} onRankSame={handleRankSame} />}
          {view === 'compare' && <CompareResults template={template} result1={result} result2={compareResult} onRankSame={handleRankSame} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
